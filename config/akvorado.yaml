---
# Akvorado on fleet-mon. Reference: https://demo.akvorado.net/docs/configuration
# Defaults: docker compose run --rm --no-deps akvorado-orchestrator orchestrator /dev/null --dump --check

kafka:
  topic: flows
  brokers:
    - kafka:9092
  topic-configuration:
    num-partitions: 8
    replication-factor: 1
    config-entries:
      segment.bytes: 1073741824
      retention.ms: 86400000 # 1 day buffer in front of ClickHouse
      cleanup.policy: delete
      compression.type: producer

clickhousedb:
  servers:
    - clickhouse:9000

clickhouse:
  orchestrator-url: http://akvorado-orchestrator:8080
  prometheus-endpoint: /metrics
  # Retention per resolution. Raw flows 7 days, then aggregated.
  resolutions:
    - interval: 0
      ttl: 168h     # raw: 7 days
    - interval: 1m
      ttl: 168h     # 7 days
    - interval: 5m
      ttl: 2160h    # 90 days
    - interval: 1h
      ttl: 8760h    # 1 year

inlet: !include "inlet.yaml"
outlet: !include "outlet.yaml"
console: !include "console.yaml"
