---
networks:
  # Fills Src/DstNetName and Src/DstNetRole. Ranges from cellwatch's defaults. The UE ranges only set
  # the role: the name (UE034) and tenant (machine) come from the fleet-ues source below.
  networks:
    10.231.0.0/18:
      role: ue-lan
    # UE Cellular0/4/0 addresses: outer IPsec (ESP / IKE) endpoints. Range from the TAG IKEv2 profile.
    10.231.64.0/22:
      role: ue-cellular
    10.231.68.0/23:
      role: ue-loopback
    # flt core: TAG headend loopbacks (IPsec endpoints) and point-to-point links.
    10.231.128.0/24:
      name: flt-core
      role: flt-core
    10.231.128.10/32:
      name: oc4-tag01-lo8
      role: vpn-headend
    10.231.128.11/32:
      name: oc4-tag01-lo88
      role: vpn-headend
    10.231.128.12/32:
      name: oc3-tag01-lo8
      role: vpn-headend
    10.231.128.13/32:
      name: oc3-tag01-lo88
      role: vpn-headend
    # Servers UEs talk to (shown as DstNetName / SrcNetName, e.g. in the dashboard's Label column).
    10.228.119.1/32:
      name: guardvant
      role: server
    10.228.224.0/24:
      name: core-mgmt
      role: infrastructure
  network-sources:
    # Per-UE prefixes from the fleet-monitor UE register (GET /api/ues/akvorado-networks.json):
    # loopback /32, LAN /28, cellular /32, vendor cellular /32 -> name "UE034", tenant = machine.
    # Reached through nginx :8090 on the host (Docker subnet only). If it's down, flows keep
    # the static labels above.
    fleet-ues:
      url: http://247.16.14.1:8090/ue-networks.json
      interval: 10m
      timeout: 30s
      # The endpoint already returns Akvorado's fields (prefix, name, role, tenant when known).
      transform: .[]

metadata:
  providers:
    - type: snmp
      # SNMPv3 for the core switches; generated by install.sh from cellwatch.env.
      credentials: !include "snmp-credentials.yaml"

core:
  # Switches export unsampled (no sampler on the monitor). Without this Akvorado drops the flows.
  default-sampling-rate: 1
  exporter-classifiers:
    # sysName YAU-MCO-OC3-CSW01 -> site "oc3"
    - ClassifySiteRegex(Exporter.Name, "^YAU-MCO-([^-]+)-", "$1")
    - ClassifyRegion("mco")
    - ClassifyTenant("yancoal")
    - ClassifyRole("core")
  interface-classifiers:
    - ClassifyInternal()
