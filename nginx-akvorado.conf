# Akvorado console over HTTPS on :9444, reusing the fleet-monitor certificate.
# Also :8090 (plain HTTP, Docker subnet only): UE names for Akvorado, see the end of this file.
#
# Sign-in is shared with the fleet-monitor dashboard (TACACS+ against Cisco ISE):
# every request is checked against fleet-monitor's /api/auth/check via auth_request.
# Not signed in -> pages go to the fleet-monitor login form (served on this port too,
# so users come back here) and API calls get 401. Signed in -> nginx passes the
# username to Akvorado as Remote-User (Akvorado trusts it; traefik only listens on
# 127.0.0.1:8081, so nothing else can set it).
# X-Original-Method is not sent, so the check treats every request as a read:
# viewers can run graphs (POSTs to /api/v0/console/...).
# Break-glass when sign-in is down: ssh -L 8081:127.0.0.1:8081 fleet-mon, then http://localhost:8081

map $request_uri $akvorado_signin_api {
    ~^/api/  1;
    default  0;
}

server {
    listen 9444 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/fleet-monitor/fleet-monitor.crt;
    ssl_certificate_key /etc/ssl/fleet-monitor/fleet-monitor.key;

    # --- shared sign-in ---
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # fleet-monitor login/logout pages, open (no sign-in needed to load them).
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @signin {
        if ($akvorado_signin_api) { return 401; }
        return 302 /api/auth/login?next=$uri;
    }

    location / {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @signin;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Always set by nginx, so a browser can't supply its own.
        proxy_set_header Remote-User $auth_user;
        proxy_set_header Remote-Name $auth_user;
        proxy_set_header Remote-Email "";
        proxy_set_header X-Logout-URL /api/auth/logout;
        proxy_read_timeout 300s;
    }
}

# UE register -> Akvorado network labels. Akvorado's outlet container fetches
# http://247.16.14.1:8090/ue-networks.json (247.16.14.1 = the akvorado Docker bridge
# gateway, i.e. this host). Only the akvorado Docker subnet may connect (nginx allow
# + ufw rule from install.sh); no sign-in, since the container can't sign in.
server {
    listen 8090;
    server_name _;

    allow 247.16.14.0/24;
    allow 127.0.0.1;
    deny all;

    location = /ue-networks.json {
        proxy_pass http://127.0.0.1:8000/api/ues/akvorado-networks.json;
        proxy_set_header Host $host;
    }
    location / {
        return 404;
    }
}

# Fleet traffic dashboard (Grafana, grafana-flows container on 127.0.0.1:3001) over HTTPS
# on :9445, same sign-in as :9444. Signed in -> nginx passes the username as Remote-User
# (Grafana auth proxy, trusted only from the Docker gateway = docker-proxy). Everyone
# signs in as a Grafana Viewer (can explore, can't save). Break-glass admin:
# ssh -L 3001:127.0.0.1:3001 fleet-mon, http://localhost:3001, user admin,
# password in /srv/akvorado/grafana-admin-password.txt.
server {
    listen 9445 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/fleet-monitor/fleet-monitor.crt;
    ssl_certificate_key /etc/ssl/fleet-monitor/fleet-monitor.key;

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @signin {
        if ($akvorado_signin_api) { return 401; }
        return 302 /api/auth/login?next=$uri;
    }

    location / {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @signin;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Grafana Live (websocket).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        # Always set by nginx, so a browser can't supply its own.
        proxy_set_header Remote-User $auth_user;
        proxy_read_timeout 300s;
    }
}
